services:
  - type: web
    name: stock-simulator
    runtime: python
    plan: free
    buildCommand: apt-get update -qq && apt-get install -y -qq ffmpeg || true; pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
